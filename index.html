<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.a.S // SPECIAL PROTOCOL v1.0</title>
    <style>
        :root {
            --glow: #ff4141;       
            --glow-dim: #8b0000;   
            --bg: #070101;         
            --bg-panel: rgba(10, 1, 1, 0.9); 
            --err: #ff0033;        
            --acc: #ff9900;        
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 600;      
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 65, 65, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 6px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 65, 65, 0.15), inset 0 0 20px rgba(255, 65, 65, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 65, 65, 0.25);
            padding-bottom: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 65, 65, 0.6); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .hub-logo {
            display: block;
            width: 250px;           
            height: auto;
            margin: 0 auto 15px auto;
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(0 0 20px var(--glow)); 
        }
        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(255, 65, 65, 0.3); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 25px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: default;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--acc);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.6); }
        .gray { color: rgba(255, 65, 65, 0.45); } 
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="las_logo.png" class="hub-logo" alt="L.a.S LOGO">
        LIQUIDATION & SECURITY // SPECIAL OPERATIONS NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER OPERATION AUTH TOKEN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    REAL_TOKEN: "702", // Настоящий токен доступа, выдаваемый в конце диалога
    SPD: 15 
};
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk') 
};
let step = 'login', isMask = false, dialogueStage = 0, wordTimer = null;
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = t; 
        osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); 
    return d;
}
// Перехват канала Командиром Ликвидаторов при вводе 368
async function triggerAmbushDialogue() {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    playBeep(520, 'sawtooth', 0.3); playBeep(380, 'sawtooth', 0.3);
    err("⚠️ ВНИМАНИЕ: СЕТЕВОЙ ПЕРЕХВАТ! ПРИНУДИТЕЛЬНОЕ ПОДКЛЮЧЕНИЕ К ВНУТРЕННЕМУ УЗЛУ КОМАНДОВАНИЯ L.a.S");
    await delay(1200);
    await type("[КАДРЫ]: Зафиксирована несанкционированная попытка авторизации через маркер 368.", "gray");
    await type("[КОМАНДИР]: Так, отставить панику в эфире. Я сам пообщаюсь с этим гостем. Позывной 'Ворон', на связи.", "success");
    await type("[КОМАНДИР]: Маркер 368 — это наш засадный тупик для ловли шпионов штаба. Раз ты его ввёл, значит, взломал каналы контрактников. Кто ты такой?", "success");
    await delay(500);
    nextDialogueStep();
}

async function nextDialogueStep() {
    clearTimeout(wordTimer);
    if (dialogueStage === 0) {
        await type("\n[КОМАНДИР]: Выкладывай карты на стол. Если ты одна из цепных псов совета директоров 'Атлантиса' — этот терминал сейчас превратится в кусок обгоревшего пластика.", "success");
        addLine("1. Я вольный хакер. Ищу скрытые архивы.", "gray");
        addLine("2. Я офицер службы безопасности ЧВК Атлантис.", "gray");
        ask('ВЫБЕРИТЕ ВАРИАНТ ОТВЕТА (1-2):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalPurgeDie("🚨 СЛИШКОМ ДОЛГОЕ МОЛЧАНИЕ. СВЯЗЬ АВТОМАТИЧЕСКИ РАЗОРВАНА."), 15000);
    } 
    else if (dialogueStage === 1) {
        await type("\n[КОМАНДИР]: Свободный искатель, значит? Рисковый ты парень. Но раз уж ты роешь инфу здесь, то должен понимать, куда попал.", "success");
        await type("[КОМАНДИР]: Наше подразделение L.a.S подчиняется 'Атлантису' только на бумаге. На деле штабные крысы превратились в абсолютных мразей. Хочешь знать правду?", "success");
        await delay(600);
        await type("[КОМАНДИР]: Пока наши штурмовики и контрактники дохнут на передовой, штабное руководство 'Атлантиса' втайне продаёт шифры уязвимостей собственной корпоративной сети на чёрном рынке! Они сливают маршруты патрулей шпионам конкурентов ради откатов!", "success");
        await type("[КОМАНДИР]: Но это ещё цветочки. Недавно мы узнали, что они намеренно блокировали целые живые сектора с людьми, консервировали там биологические угрозы и использовали гражданских как подопытных крыс, чтобы тестировать на них новые цифровые скрамблеры для стирания памяти! Они буквально выжигали людям мозги, чтобы скрыть свои косяки!", "success");
        await type("[КОМАНДИР]: 'Атлантис' — это прогнившая насквозь опухоль. И моё подразделение готовит внутренний саботаж. Мне нужны люди, готовые вывалить их грязное бельё в сеть.", "success");
        
        await type("\n[КОМАНДИР]: Если я открою тебе доступ к засекреченным файлам Ликвидаторов, ты поможешь мне уничтожить центральные базы данных Атлантиса?", "success");
        addLine("1. Идёт. После услышанного я сотру их логи к чертям.", "gray");
        addLine("2. Меня интересует только нажива. Обойдётесь без меня.", "gray");
        ask('ВЫБЕРИТЕ ВАРИАНТ ОТВЕТА (1-2):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalPurgeDie("🚨 ВРЕМЯ НА ОТВЕТ ИСТЕКЛО. КОМАНДИР ОТКЛЮЧИЛ КАНАЛ."), 15000);
    }
}
// Успешное прохождение допроса
async function successAmbushDialogue() {
    clearTimeout(wordTimer);
    await type("\n[КОМАНДИР]: Наш человек. Рад, что среди хакеров остались люди с мозгами, а не только мародёры.", "success");
    await type("[КОМАНДИР]: Слушай и записывай. Настоящий, боевой токен доступа к зашифрованной сети L.a.S —.", "success");
    await type("[КОМАНДИР]: Вводи его на стартовом экране консоли. Забирай файлы спецопераций и готовься к глобальному взлому. Конец связи, Ворон оффлайн.", "success");
    playBeep(250, 'triangle', 0.6);
    await delay(3500);
    DOM.out.innerHTML = "";
    step = 'login';
    ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}

// Главное меню Liquidation & Security при авторизации через код 702
async function openSecureLasMenu() {
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("СВЯЗЬ С СЕТЬЮ LIQUIDATION & SECURITY УСТАНОВЛЕНА.", "success");
    await type("1. БАЗА ТАКТИЧЕСКИХ ЦЕЛЕЙ", "success");
    await type("2. СТАТУС ЗАЧИСТКИ СЕКТОРОВ", "success");
    await type("3. АРХИВ СПЕЦОПЕРАЦИЙ L.a.S", "success");
    await type("4. ВЫЙТИ ИЗ КОНСОЛИ", "success");
    await type("========================================", "gray");
    ask('ENTER COMMAND:', 'las_menu', false);
}
DOM.inp.oninput = () => { DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); // Железная защита от обновления страницы браузером при нажатии Enter

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    // ЭКРАН СТАРТОВОГО ЛОГИНА
    if (step === 'login') {
        if (cv === '368') {
            triggerAmbushDialogue(); // Запуск засады Командира Ворона
        } else if (cv === CFG.REAL_TOKEN) {
            await bar(); // Прогресс-бар дешифрации
            await openSecureLasMenu(); // Главное меню L.a.S
        } else {
            err("CRITICAL ERROR: ACCESS DENIED. ACCOUNT SUSPENDED.");
            await delay(1500);
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    } 
    // ОБРАБОТЧИК ФАЗ ДИАЛОГА С ВОРОНОМ
    else if (step === 'ambush_choice') {
        clearTimeout(wordTimer);
        if (dialogueStage === 0) {
            if (cv === '1') {
                dialogueStage = 1;
                nextDialogueStep(); // Переход ко 2-му этапу
            } else {
                // Если признался, что из безопасности Атлантиса — мгновенная утилизация
                await terminalPurgeDie("🚨 [КОМАНДИР]: Штабной соглядатай! Охрана, запеленговать узел и сжечь порт к чертям!");
            }
        } 
        else if (dialogueStage === 1) {
            if (cv === '1') {
                successAmbushDialogue(); // Правильный ответ — победа и получение кода 702
            } else {
                // Если выбрал наживу — Ворон сливает сессию
                await terminalPurgeDie("🚨 [КОМАНДИР]: Обычный мародёр. Рисковать планом ради торгаша я не буду. Выжигаю канал.");
            }
        }
    }
    // Обработчик Главного меню L.a.S
    else if (step === 'las_menu') {
        if (cv === '4') {
            await type(">>> РАЗРЫВ СЕДИНЕНИЯ С СЕТЬЮ L.a.S...", "gray");
            await delay(1000); DOM.out.innerHTML = ""; step = 'login';
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        } else if (cv === '1' || cv === '2' || cv === '3') {
            await type(">>> ОШИБКА:ДАННЫЙ РАЗДЕЛ ЗАШИФРОВАН. ОЖИДАНИЕ ТАКТИЧЕСКИХ ФАЗ...", "error");
            await delay(1500); ask('ENTER COMMAND:', 'las_menu', false);
        } else {
            err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); ask('ENTER COMMAND:', 'las_menu', false);
        }
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runBootLogs;
</script>
</body>
</html>
