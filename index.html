<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.a.S // SPECIAL PROTOCOL v1.0</title>
    <style>
        :root {
            --glow: #ff4141;       
            --glow-dim: #8b0000;   
            --bg: #070101;         
            --bg-panel: rgba(10, 1, 1, 0.9); 
            --err: #ff0033;        
            --acc: #ff9900;        
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 600;      
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 65, 65, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 6px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 65, 65, 0.15), inset 0 0 20px rgba(255, 65, 65, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 65, 65, 0.25);
            padding-bottom: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 65, 65, 0.6); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .header-logo-text {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--glow);
        }
        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(255, 65, 65, 0.3); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 25px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: default;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--acc);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.6); }
        .gray { color: rgba(255, 65, 65, 0.45); } 
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <div class="header-logo-text">[ L.a.S ]</div>
        LIQUIDATION & SECURITY // SPECIAL OPERATIONS NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER OPERATION AUTH TOKEN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    REAL_TOKEN: "702", 
    SPD: 15 
};
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk') 
};
let step = 'login', isMask = false, dialogueStage = 0, wordTimer = null;
let strikes = 0; 
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = t; 
        osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); 
    return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(650, 'triangle', 0.02); 
        await delay(CFG.SPD);
    }
}

async function runBootLogs() {
    const p = [
        "ESTABLISHING SECURE SAT-LINK... SUCCESS", 
        "LOADING LIQUIDATION ENGINES... LOADED", 
        "ISOLATING LOCAL ENVIRONMENTS... DONE", 
        "PURGING UNRESOLVED TRACKERS... PURGED", 
        "CRITICAL PROTOCOL 'L.a.S' ACTIVE."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(120 + Math.random() * 150); 
        addLine("[L.a.S-NET] | " + p[i], 'gray'); 
        playBeep(90, 'sawtooth', 0.01);
    }
    await delay(400); 
    await type("SYS: SECURE NETWORK DETECTED. AUTHORIZATION REQUIRED.", "gray");
    await type("SYS: MONITORING IS ENFORCED.", "error"); 
    ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}

function ask(p, s, m) { 
    step = s; 
    isMask = m; 
    DOM.pr.textContent = p; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

function err(m) { 
    DOM.term.classList.add('shake'); 
    playBeep(140, 'triangle', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); 
    addLine(m, "error"); 
}

async function terminalScramblerDie(m) {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active');
    DOM.inp.disabled = true;
    err(m);
    await delay(1000);
    await type("[ВОРОН]: Код Скрамблера активирован. Спи спокойно, шпион.", "error");
    await delay(1500);
    DOM.out.innerHTML = "";
    document.getElementById('hd').style.display = 'none';
    playBeep(60, 'sawtooth', 2.0);
    DOM.term.classList.add('shake');
    
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center";
    errBox.style.textShadow = "0 0 15px #ff1111";
    await delay(2000);
    location.reload();
}

async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING CONTRATORS DATA: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(350 + p * 1.5, 'sine', 0.02); 
        await delay(45); 
    }
}
async function triggerAmbushDialogue() {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    playBeep(520, 'sawtooth', 0.3); playBeep(380, 'sawtooth', 0.3);
    err("⚠️ ВНИМАНИЕ: СЕТЕВОЙ ПЕРЕХВАТ! ПРИНУДИТЕЛЬНОЕ ПОДКЛЮЧЕНИЕ К УЗЛУ КОМАНДОВАНИЯ L.a.S");
    await delay(1200);
    await type("[КАДРЫ]: Зафиксирована несанкционированная попытка авторизации через маркер 368.", "gray");
    await type("[КОМАНДИР]: Так, отставить панику в эфире. Я сам пообщаюсь с этим гостем. Позывной 'Ворон', на связи.", "success");
    await type("[КОМАНДИР]: Маркер 368 — это наш засадный тупик для ловли шпионов. Раз ты его ввёл, значит, перехватил каналы контрактников. Кто ты такой?", "success");
    await delay(500);
    strikes = 0;
    dialogueStage = 0;
    nextDialogueStep();
}

async function nextDialogueStep() {
    clearTimeout(wordTimer);
    if (dialogueStage === 0) {
        await type("\n[КОМАНДИР]: Каким образом к тебе попал код экстренной засады 368? В нашей закрытой подсети случайные совпадения исключены протоколом безопасности.", "success");
        addLine("1. Набрал наугад первые попавшиеся цифры.", "gray");
        addLine("2. Код извлечен из взломанного архива контрактников Атлантиса.", "gray");
        addLine("3. Мне выдали его на КПП при въезде в закрытый сектор.", "gray");
        ask('ВЫБЕРИТЕ ВАРИАНТ ОТВЕТА (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 СЛИШКОМ ДОЛГОЕ МОЛЧАНИЕ. СВЯЗЬ АВТОМАТИЧЕСКИ РАЗОРВАНА."), 15000);
    } 
    else if (dialogueStage === 1) {
        await type("\n[КОМАНДИР]: Хм. Значит, ты копался в их грязных логах. Тогда ты должен знать, какие твари сидят в совете директоров 'Атлантиса'. Пока наши пацаны гибнут в поле, эти крысы тайно продают корпоративные шифры конкурентам ради откатов и используют гражданских как подопытных для тестирования стирающих память скрамблеров!", "success");
        await type("[КОМАНДИР]: Моё подразделение готовит внутренний мятеж, чтобы сжечь эту контору к чертям. Если начнётся зачистка штаба, ты пойдёшь за нами проливать кровь, или прикроешь спину руководству Атлантиса?", "success");
        addLine("1. Я готов идти в первых рядах штурма, Атлантис должен сгореть!", "gray");
        addLine("2. Я останусь на стороне руководства, контракт обязывает.", "gray");
        addLine("3. Мне плевать на ваши разборки. Я нейтральный профи, мне просто нужен доступ к их главному серверу.", "gray");
        ask('ВЫБЕРИТЕ ВАРИАНТ ОТВЕТА (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ НА ОТВЕТ ИСТЕКЛО. КОМАНДИР ОТКЛЮЧИЛ КАНАЛ."), 15000);
    }
}
async function successAmbushDialogue() {
    clearTimeout(wordTimer);
    await type("\n[КОМАНДИР]: Разумный ответ. Нам не нужны безумные фанатики, кричащие о верности, нам нужны холодные профессионалы.", "success");
    await type("[КОМАНДИР]: Слушай и записывай. Истинный токен доступа к зашифрованной сети Ликвидаторов L.a.S — 702", "success");
    await type("[КОМАНДИР]: Вводи его на стартовом экране. Выкачивай их тактические базы и готовься к удару. Конец связи.", "success");
    playBeep(250, 'triangle', 0.6);
    await delay(3500);
    DOM.out.innerHTML = "";
    step = 'login';
    ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}

async function openSecureLasMenu() {
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("СВЯЗЬ С СЕТЬЮ LIQUIDATION & SECURITY УСТАНОВЛЕНА.", "success");
    await type("1. БАЗА ТАКТИЧЕСКИХ ЦЕЛЕЙ", "success");
    await type("2. СТАТУС ЗАЧИСТКИ СЕКТОРОВ", "success");
    await type("3. АРХИВ СПЕЦОПЕРАЦИЙ L.a.S", "success");
    await type("4. ВЫЙТИ ИЗ КОНСОЛИ", "success");
    await type("========================================", "gray");
    ask('ENTER COMMAND:', 'las_menu', false);
}
DOM.inp.oninput = () => { if(step !== 'game') DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); 

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    if (step === 'login') {
        if (cv === '368') {
            triggerAmbushDialogue(); 
        } else if (cv === CFG.REAL_TOKEN) {
            await bar(); 
            await openSecureLasMenu(); 
        } else {
            err("CRITICAL ERROR: ACCESS DENIED. ACCOUNT SUSPENDED.");
            await delay(1500);
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    } 
    else if (step === 'ambush_choice') {
        clearTimeout(wordTimer);
        if (dialogueStage === 0) {
            if (cv === '2') { 
                dialogueStage = 1;
                nextDialogueStep();
            } else {
                strikes++;
                if (strikes >= 2) {
                    await terminalScramblerDie("🚨 [КОМАНДИР]: Ты лжёшь мне в лицо, шпион. Ликвидация узла связи.");
                } else {
                    err("❌ [ВОРОН]: ХУЕВАЯ ПОПЫТКА. Я вижу твои порты насквозь. Отвечай честно, или я нажму кнопку.");
                    await delay(1500); nextDialogueStep();
                }
            }
        } 
        else if (dialogueStage === 1) {
            if (cv === '3') { 
                successAmbushDialogue();
            } else {
                strikes++;
                if (strikes >= 2) {
                    await terminalScramblerDie("🚨 [КОМАНДИР]: Дешёвый шпион. Слишком фальшивые слова. Стираю систему.");
                } else {
                    err("❌ [ВОРОН]: Твоя легенда сыпется, наёмник. Мне не нужны подлизы Атлантиса. Последний шанс сказать правду.");
                    await delay(1500); nextDialogueStep();
                }
            }
        }
    }
    else if (step === 'las_menu') {
        if (cv === '4') {
            await type(">>> РАЗРЫВ СОЕДИНЕНИЯ С СЕТЬЮ L.a.S...", "gray");
            await delay(1000); DOM.out.innerHTML = ""; step = 'login';
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        } else if (cv === '1' || cv === '2' || cv === '3') {
            await type(">>> ОШИБКА: РАЗДЕЛ ЗАШИФРОВАН. ОЖИДАНИЕ ТАКТИЧЕСКИХ ФАЗ С СЕРВЕРА...", "error");
            await delay(1500); ask('ENTER COMMAND:', 'las_menu', false);
        } else {
            err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); ask('ENTER COMMAND:', 'las_menu', false);
        }
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runBootLogs;
</script>
</body>
</html>
