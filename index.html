<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.a.S // SPECIAL PROTOCOL v1.0</title>
    <style>
        :root {
            --glow: #ff4141;       /* Повышенная яркость: сочный кораллово-красный */
            --glow-dim: #8b0000;   /* Тёмно-бордовый для чётких рамок */
            --bg: #070101;         /* Глубокий чёрный фон */
            --bg-panel: rgba(10, 1, 1, 0.9); /* Повышенная плотность: фон почти не просвечивает */
            --err: #ff0033;        /* Кроваво-красный для критических ошибок */
            --acc: #ff9900;        /* Янтарно-оранжевый для спец-уведомлений */
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       /* Увеличен размер шрифта для лучшей читаемости */
            font-weight: 600;      /* Сделан чуть жирнее, чтобы буквы не расплывались */
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        /* Оптимизированные сканлайны: не перекрывают текст */
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 65, 65, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); /* Утолщённая контрастная рамка */
            border-radius: 6px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 65, 65, 0.15), inset 0 0 20px rgba(255, 65, 65, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 65, 65, 0.25);
            padding-bottom: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 65, 65, 0.6); /* Мягкое неоновое свечение */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .hub-logo {
            display: block;
            max-width: 165px;
            height: auto;
            margin: 0 auto 15px auto;
            opacity: 0.9;
            pointer-events: none;
            filter: drop-shadow(0 0 10px var(--glow));
        }
        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(255, 65, 65, 0.3); /* Повышает контрастность букв */
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 25px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: default;
        }
        .custom-view {
            color: #ffffff;        /* Чистый белый цвет для ввода пользователя */
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     /* Оранжевый контрастный курсор */
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--acc);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.6); }
        .gray { color: rgba(255, 65, 65, 0.45); } /* Слегка подсвечены серые логи */
    </style>
</head>
    
<body>
<div class="terminal-box" id="term">
    <!-- Шапка переименована под Ликвидаторов, картинка las_logo.png -->
    <div class="header" id="hd">
        <img src="las_logo.png" class="hub-logo" alt="L.a.S LOGO">
        LIQUIDATION & SECURITY // SPECIAL OPERATIONS NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">CLEARANCE ACCESS KEY:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    SPD: 15 /* Скорость печати букв */
};
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk') 
};
let step = 'boot', isMask = false, targetWord = "", wordTimer = null;
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

/* Базовые багровые клики звукового генератора */
function playBeep(f, t, d) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = t; 
        osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); 
    return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(650, 'triangle', 0.02); /* Более глухой, аналоговый клик */
        await delay(CFG.SPD);
    }
}

/* Новые тактические логи загрузки для карательного подразделения L.a.S */
async function runBootLogs() {
    const p = [
        "ESTABLISHING SECURE SAT-LINK... SUCCESS", 
        "LOADING LIQUIDATION ENGINES... LOADED", 
        "ISOLATING LOCAL ENVIRONMENTS... DONE", 
        "PURGING UNRESOLVED TRACKERS... PURGED", 
        "CRITICAL PROTOCOL 'L.a.S' ACTIVE."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(120 + Math.random() * 150); 
        addLine("[L.a.S-NET] | " + p[i], 'gray'); 
        playBeep(90, 'sawtooth', 0.01);
    }
    await delay(400); 
    await type("SYS: SECURE NETWORK DETECTED. AUTHORIZATION REQUIRED.", "gray");
    await type("SYS: MONITORING IS ENFORCED.", "error"); 
    ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}

function ask(p, s, m) { 
    step = s; 
    isMask = m; 
    DOM.pr.textContent = p; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

function err(m) { 
    DOM.term.classList.add('shake'); 
    playBeep(110, 'triangle', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); 
    addLine(m, "error"); 
}
/* Универсальный багровый прогресс-бар дешифрации/загрузки пакетов */
async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING SPEC-OPERATIONS DATA: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(350 + p * 1.5, 'sine', 0.02); 
        await delay(45); 
    }
}

/* Место для будущих функций Главного меню L.a.S */
async function openSecureLasMenu() {
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("ТВОЙ КРЕАТИВ ТЕПЕРЬ БУДЕТ ЗДЕСЬ!", "gray");
    await type("========================================", "gray");
    
    // Сюда будешь накидывать новые пункты меню
    ask('ENTER COMMAND:', 'las_menu', false);
}
/* 
   Сюда мы засунем твои новые, уникальные фазы для L.a.S, 
   когда ты расскажешь, что именно хочешь сделать!
*/
function startLasCustomPhase1() {
    step = 'las_phase_1';
    addLine("\n>>> ИНИЦИАЛИЗАЦИЯ ТВОЕЙ НОВОЙ ФАЗЫ...", "success");
    ask('ВВОД ДАННЫХ:', 'las_phase_1', false);
}
DOM.inp.oninput = () => { DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); // Железный блок перезагрузки страницы при Enter!

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    // БАЗОВАЯ ПРОВЕРКА ВХОДА (Для теста шаблона поставил токен "123")
    if (step === 'login') {
        if (cv === '123') {
            await bar();
            await openSecureLasMenu();
        } else {
            err("CRITICAL ERROR: ACCESS DENIED. ACCOUNT SUSPENDED.");
            await delay(1500);
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    } 
    // Будущая логика твоего кастомного меню L.a.S
    else if (step === 'las_menu') {
        await type(">>> ПРИНЯТО. ОБРАБОТКА КОМАНДЫ...", "gray");
        startLasCustomPhase1(); // Для примера переводит на заглушку фазы 1
    }
    // Будущая логика проверок твоих фаз
    else if (step === 'las_phase_1') {
        await type(">>> ТЕСТ ПРОЙДЕН. ВОЗВРАТ В ШАБЛОН.", "success");
        await delay(1000);
        DOM.out.innerHTML = "";
        openSecureLasMenu();
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runBootLogs;
</script>
</body>
</html>

        playBeep(350 + p * 1.5, 'sine', 0.02); 
        await delay(45); 
    }
}

/* Место для будущих функций Главного меню L.a.S */
async function openSecureLasMenu() {
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("ТВОЙ КРЕАТИВ ТЕПЕРЬ БУДЕТ ЗДЕСЬ!", "gray");
    await type("========================================", "gray");
    
    // Сюда будешь накидывать новые пункты меню
    ask('ENTER COMMAND:', 'las_menu', false);
}
/* 
   Сюда мы засунем твои новые, уникальные фазы для L.a.S, 
   когда ты расскажешь, что именно хочешь сделать!
*/
function startLasCustomPhase1() {
    step = 'las_phase_1';
    addLine("\n>>> ИНИЦИАЛИЗАЦИЯ ТВОЕЙ НОВОЙ ФАЗЫ...", "success");
    ask('ВВОД ДАННЫХ:', 'las_phase_1', false);
}
DOM.inp.oninput = () => { DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); // Железный блок перезагрузки страницы при Enter!

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    // БАЗОВАЯ ПРОВЕРКА ВХОДА (Для теста шаблона поставил токен "123")
    if (step === 'login') {
        if (cv === '123') {
            await bar();
            await openSecureLasMenu();
        } else {
            err("CRITICAL ERROR: ACCESS DENIED. ACCOUNT SUSPENDED.");
            await delay(1500);
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    } 
    // Будущая логика твоего кастомного меню L.a.S
    else if (step === 'las_menu') {
        await type(">>> ПРИНЯТО. ОБРАБОТКА КОМАНДЫ...", "gray");
        startLasCustomPhase1(); // Для примера переводит на заглушку фазы 1
    }
    // Будущая логика проверок твоих фаз
    else if (step === 'las_phase_1') {
        await type(">>> ТЕСТ ПРОЙДЕН. ВОЗВРАТ В ШАБЛОН.", "success");
        await delay(1000);
        DOM.out.innerHTML = "";
        openSecureLasMenu();
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runBootLogs;
</script>
