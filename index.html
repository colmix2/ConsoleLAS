<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.a.S // SPECIAL PROTOCOL v1.0</title>
    <style>
        :root {
            --glow: #ff4141;       
            --glow-dim: #8b0000;   
            --bg: #070101;         
            --bg-panel: rgba(10, 1, 1, 0.9); 
            --err: #ff0033;        
            --acc: #ff9900;        
        }
        /* Блокируем внешнюю прокрутку всей страницы сайта */
        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        body {
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 600;      
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 65, 65, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        /* Коробка терминала фиксируется по высоте экрана */
        .terminal-box {
            width: 95%;
            max-width: 850px;
            height: 90vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 6px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 65, 65, 0.15), inset 0 0 20px rgba(255, 65, 65, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 65, 65, 0.25);
            padding-bottom: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 65, 65, 0.6); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0; 
        }
        .hub-logo {
            display: block;
            width: 160px;           
            height: auto;
            margin: 0 auto 10px auto; 
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(0 0 20px var(--glow)); 
        }
        /* Блок двойных логотипов (Split-Screen) при взломе кассет */
        .split-logos-container {
            display: none;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }
        .split-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        .split-logo-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }
        .split-logo-img.cerb { border: 2px solid #ffcc00; filter: drop-shadow(0 0 15px #ffcc00); }
        .split-logo-img.tfb { border: 2px solid #ff4141; filter: drop-shadow(0 0 15px #ff4141); }
        .split-logo-label {
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        /* Внутренний скролл-бокс для текста логов */
        #out {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        #out::-webkit-scrollbar-thumb { background: var(--glow-dim); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(255, 65, 65, 0.3); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 65, 65, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--acc);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.6); }
        .gray { color: rgba(255, 65, 65, 0.45); } 
        .text-cerberus { color: #00cc33; text-shadow: 0 0 5px rgba(0, 204, 51, 0.5); }
        .text-tfb { color: #ff4141; text-shadow: 0 0 5px rgba(255, 65, 65, 0.5); }
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="las_logo.png" class="hub-logo" id="single-logo" alt="L.a.S LOGO">
        
        <div class="split-logos-container" id="split-logos">
            <div class="split-logo-box">
                <img src="ART_logo.png" class="split-logo-img cerb" alt="LEFT">
                <span class="split-logo-label text-cerberus" id="left-label">UNIT: RE-UNION</span>
            </div>
            <div class="split-logo-box">
                <img src="las_logo.png" class="split-logo-img tfb" alt="RIGHT">
                <span class="split-logo-label text-tfb" id="right-label">UNIT: L.a.S NETWORK</span>
            </div>
        </div>

        <div id="header-title" style="text-align:center; width:100%;">LIQUIDATION & SECURITY // SPECIAL OPERATIONS NETWORK</div>
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER OPERATION AUTH TOKEN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { REAL_TOKEN: "702", SPD: 15 };
const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    singleLogo: document.getElementById('single-logo'), splitLogos: document.getElementById('split-logos'),
    hdTitle: document.getElementById('header-title')
};
let step = 'login', isMask = false, dialogueStage = 0, wordTimer = null;
let strikes = 0; const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) return; 
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); playBeep(650, 'triangle', 0.02); await delay(CFG.SPD);
    }
}
async function runBootLogs() {
    DOM.out.innerHTML = "";
    const p = [
        "ESTABLISHING SECURE SAT-LINK... SUCCESS", "LOADING LIQUIDATION ENGINES... LOADED", 
        "ISOLATING LOCAL ENVIRONMENTS... DONE", "PURGING UNRESOLVED TRACKERS... PURGED", 
        "CRITICAL PROTOCOL 'L.a.S' ACTIVE."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(80 + Math.random() * 80); addLine("[L.a.S-NET] | " + p[i], 'gray'); 
    }
    await delay(300); 
    await type("SYS: SECURE NETWORK DETECTED. AUTHORIZATION REQUIRED.", "gray");
    await type("SYS: MONITORING IS ENFORCED.", "error"); ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}
function ask(p, s, m) { 
    step = s; isMask = m; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); 
}
function err(m) { 
    DOM.term.classList.add('shake'); playBeep(140, 'triangle', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); 
}
async function terminalScramblerDie(m) {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true; err(m); await delay(1000);
    await type("[ВОРОН]: Код Скрамблера активирован. Спи спокойно, крыса.", "error"); await delay(1500);
    DOM.out.innerHTML = ""; DOM.singleLogo.style.display = 'block'; DOM.splitLogos.style.display = 'none';
    document.getElementById('hd').style.display = 'none'; playBeep(60, 'sawtooth', 2.0); DOM.term.classList.add('shake');
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center"; await delay(2000); location.reload();
}
async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING CONTRATORS DATA: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(350 + p * 1.5, 'sine', 0.02); await delay(45); 
    }
}
async function triggerAmbushDialogue() {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    playBeep(520, 'sawtooth', 0.3); playBeep(380, 'sawtooth', 0.3);
    err("⚠️ ВНИМАНИЕ: СЕТЕВОЙ ПЕРЕХВАТ! ПРИНУДИТЕЛЬНОЕ ПОДКЛЮЧЕНИЕ К УЗЛУ КОМАНДОВАНИЯ L.a.S"); await delay(1200);
    await type("[КАДРЫ]: Зафиксирована несанкционированная попытка авторизации через маркер 368.", "gray");
    await type("[КОМАНДИР]: Так, отставить панику в эфире. Я сам пообщаюсь с этим гостем. Позывной 'Ворон', на связи.", "success");
    await type("[КОМАНДИР]: Маркер 368 — это наш засадный тупик для ловли шпионов. Раз ты его ввёл, значит, перехватил каналы контрактников.", "success");
    await type("[КОМАНДИР]: Но учти сразу. Я люто презираю Сергея Долороффа — эту штабную гниду из Атлантиса. И я лично убью любого, кто хоть как-то связан с ним или его кодлой. А теперь я устрою тебе проверку.", "success");
    await delay(2000); strikes = 0; dialogueStage = 0; nextDialogueStep();
}
async function nextDialogueStep() {
    clearTimeout(wordTimer);
    if (dialogueStage === 0) {
        await type("\n[КОМАНДИР]: ВОПРОС 1. Как назывался вирус в секретном отчёте департамента, который ты читал?", "success");
        addLine("1. Вирус WE-30", "gray"); addLine("2. Протокол ATL-4091", "gray"); addLine("3. Скрипт SC-REVERSE", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 СЛИШКОМ ДОЛГОЕ МОЛЧАНИЕ. СВЯЗЬ АВТОМАТИЧЕСКИ РАЗОРВАНА."), 35000);
    } 
    else if (dialogueStage === 1) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 2. Как звали связующего по ТОС, который каждый раз запрашивал верификацию в терминале?", "success");
        addLine("1. Agent Andrey", "gray"); addLine("2. Operator Bill", "gray"); addLine("3. Commander Sin", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. КОМАНДИР ЗАКРЫЛ КАНАЛ."), 35000);
    }
    else if (dialogueStage === 2) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 3. Откуда конкретно ты узнал про существование этой базы данных Атлантиса?", "success");
        addLine("1. Через досье сотрудника Атлантиса", "gray"); addLine("2. Через биографию Сергея Долороффа", "gray"); addLine("3. Перехвачено со спутникового ретранслятора", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. КОМАНДИР ЗАКРЫЛ КАНАЛ."), 35000);
    }
    else if (dialogueStage === 3) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 4. Какой ID был у сотрудника из того самого досье, где ты взял информацию о базе данных?", "success");
        addLine("1. Сотрудник ID: 504", "gray"); addLine("2. Сотрудник ID: 231", "gray"); addLine("3. Сотрудник ID: 712", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. КОМАНДИР ЗАКРЫЛ КАНАЛ."), 35000);
    }
    else if (dialogueStage === 4) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 5. Как зовут главнокомандующего Рассонии?", "success");
        addLine("1. Командир Ворон", "gray"); addLine("2. General Седой", "gray"); addLine("3. Командир Син", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. КОМАНДИР ЗАКРЫЛ КАНАЛ."), 35000);
    }
    else if (dialogueStage === 5) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ФИНАЛ. Атлантис тайно ставит опыты на людях и сливает своих же бойцов. Если я открою шлюз, ты поможешь L.a.S саботировать их центральный server?", "success");
        addLine("1. Да, я сотру Атлантис в порошок.", "gray"); addLine("2. Нет, я остаюсь верен контракту штаба.", "gray"); addLine("3. Мне просто нужны файлы спецопераций.", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. КОМАНДИР ЗАКРЫЛ КАНАЛ."), 35000);
    }
}
async function successAmbushDialogue() {
    clearTimeout(wordTimer); DOM.out.innerHTML = "";
    await type("[КОМАНДИР]: Разумный выбор. Ты прошёл допрос и доказал, что не связан с шавками Долороффа.", "success");
    await type("[КОМАНДИР]: Слушай и записывай. Истинный токен доступа к зашифрованной сети Ликвидаторов L.a.S — 702", "success");
    await type("[КОМАНДИР]: Вводи его на стартовом экране. Выкачивай тактические базы и готовься к удару. Конец связи.", "success");
    playBeep(250, 'triangle', 0.6); await delay(3500); DOM.out.innerHTML = ""; step = 'login'; ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}
async function openSecureLasMenu() {
    DOM.out.innerHTML = "";
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("СВЯЗЬ С СЕТЬЮ LIQUIDATION & SECURITY УСТАНОВЛЕНА.", "success");
    await type("1. БАЗА ТАКТИЧЕСКИХ ЦЕЛЕЙ", "success"); await type("2. СТАТУС ЗАЧИСТКИ СЕКТОРОВ", "success");
    await type("3. АРХИВ СПЕЦОПЕРАЦИЙ L.a.S", "success"); await type("4. ВЫЙТИ ИЗ КОНСОЛИ", "success");
    await type("========================================", "gray"); ask('ENTER COMMAND:', 'las_menu', false);
}
let cassetteStage = 0, cassetteTimer = null;
async function showCassetteArchive() {
    DOM.out.innerHTML = ""; step = 'select_cassette'; 
    await type("=== ЦЕНТРАЛЬНЫЙ АРХИВ ОПЕРАТИВНЫХ КАССЕТ L.a.S ===", "success");
    addLine("[КАССЕТА №1] — ЗАПИСЬ: Контракт Re-Union // Тесты Вакцины", "success");
    addLine("[КАССЕТА №2] — ЗАПИСЬ: Отчёт WE-30 // Био-Патоген", "success");
    addLine("[КАССЕТА №3] — ЗАПИСЬ: Сектор 12 // Зачистка (Повреждено)", "gray");
    addLine("[КАССЕТА №4] — МАРКЕР: [ CERB ] // ТАКТИЧЕСКИЙ ПЕРЕХВАТ", "success");
    addLine("5. НАЗАД В ГЛАВНОЕ МЕНЮ", "gray");
    ask('ВЫБЕРИТЕ НОМЕР КАССЕТЫ ДЛЯ ДЕШИФРАЦИИ:', 'select_cassette', false);
}
function startReUnionHacking() {
    step = 'reunion_h_1'; DOM.out.innerHTML = "";
    err("⚠️ ДЕШИФРАЦИЯ ДАННЫХ RE-UNION: ЭТАП 1/1 (ЯПОНСКИЙ КРИПТОШЛЮЗ)");
    let code = Math.floor(100 + Math.random() * 900).toString(); targetWord = code;
    addLine(`>>> КВАНТОВЫЙ КЛЮЧ НИИ: [ ${code} ]`, "error"); ask('ПОВТОРИТЕ КЛЮЧ ДЛЯ СИНХРОНИЗАЦИИ:', 'reunion_h_1', false);
    clearTimeout(cassetteTimer); cassetteTimer = setTimeout(() => terminalScramblerDie("🚨 RE-UNION БЛОКИРОВКА."), 35000);
}
async function successReUnionHacking() {
    clearTimeout(cassetteTimer); DOM.out.innerHTML = ""; await bar();
    await type("=== АУДИОПРОТОКОЛ ЗАСЕКРЕЧЕННОГО СОВЕЩАНИЯ L.a.S / RE-UNION ===", "success");
    await type("[ОФИЦЕР L.a.S]: Из Токио прибыли эти русские специалисты. Ведут себя нагло, вся власть у их военных. Требуют выдать им партию 'расходников' из Spunk-DShH.", "gray"); await delay(2500);
    await type("[КОМАНДОВАНИЕ]: Выдать. Они на равных условиях с S.B.A. Их вакцина от Окинавского каменного вируса — наш приоритет. Наша задача — оказывать им огневую поддержку при побегах подопытных и налётах.", "gray"); await delay(3000);
    await type("[ОФИЦЕР L.a.S]: Принято. Контракт подписан. Начинаем конвоирование.", "gray");
    await type("===================================================", "success"); await delay(5000); showCassetteArchive();
}
function startWe30Hacking() {
    step = 'we30_h_1'; DOM.out.innerHTML = "";
