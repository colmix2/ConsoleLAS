<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.a.S // SPECIAL PROTOCOL v1.0</title>
    <style>
        :root {
            --glow: #ff4141;       /* Багровый цвет Ликвидаторов */
            --glow-dim: #8b0000;   
            --bg: #070101;         
            --bg-panel: rgba(10, 1, 1, 0.9); 
            --err: #ff0033;        
            --acc: #ff9900;        
        }
        /* Жёсткая No-Scroll фиксация экрана */
        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        body {
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 600;      
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 65, 65, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        /* Коробка терминала фиксируется строго по высоте экрана */
        .terminal-box {
            width: 95%;
            max-width: 850px;
            height: 90vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 6px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 65, 65, 0.15), inset 0 0 20px rgba(255, 65, 65, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 65, 65, 0.25);
            padding-bottom: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 65, 65, 0.6); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0; 
        }
        .hub-logo {
            display: block;
            width: 160px;           
            height: auto;
            margin: 0 auto 10px auto; 
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(0 0 20px var(--glow)); 
        }
        /* Блок двойных логотипов (Split-Screen) при радиоперехватах */
        .split-logos-container {
            display: none;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }
        .split-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        .split-logo-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            pointer-events: none;
        }
        .split-logo-img.cerb { border: 2px solid #ffcc00; filter: drop-shadow(0 0 15px #ffcc00); }
        .split-logo-img.tfb { border: 2px solid #ff4141; filter: drop-shadow(0 0 15px #ff4141); }
        .split-logo-label {
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        /* Текст крутится строго внутри этого No-Scroll окна логов */
        #out {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        #out::-webkit-scrollbar-thumb { background: var(--glow-dim); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(255, 65, 65, 0.3); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 65, 65, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     
            animation: blink 0.8s infinite;
            text-shadow: 0 0 10px var(--acc);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 51, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 153, 0, 0.6); }
        .gray { color: rgba(255, 65, 65, 0.45); } 
        .text-cerberus { color: #00cc33; text-shadow: 0 0 5px rgba(0, 204, 51, 0.5); }
        .text-tfb { color: #ff4141; text-shadow: 0 0 5px rgba(255, 65, 65, 0.5); }
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="las_logo.png" class="hub-logo" id="single-logo" alt="L.a.S LOGO">
        
        <div class="split-logos-container" id="split-logos">
            <div class="split-logo-box">
                <img src="ART_logo.png" class="split-logo-img cerb" alt="LEFT">
                <span class="split-logo-label text-cerberus" id="left-label">UNIT: RE-UNION</span>
            </div>
            <div class="split-logo-box">
                <img src="las_logo.png" class="split-logo-img tfb" alt="RIGHT">
                <span class="split-logo-label text-tfb" id="right-label">UNIT: L.a.S NETWORK</span>
            </div>
        </div>

        <div id="header-title" style="text-align:center; width:100%;">LIQUIDATION & SECURITY // SPECIAL OPERATIONS NETWORK</div>
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER OPERATION AUTH TOKEN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { REAL_TOKEN: "702", SPD: 15 };
const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk'),
    singleLogo: document.getElementById('single-logo'), splitLogos: document.getElementById('split-logos'),
    hdTitle: document.getElementById('header-title')
};
let step = 'click_to_start', isMask = false, dialogueStage = 0, wordTimer = null, targetWord = "";
let strikes = 0; const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) return; 
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); playBeep(650, 'triangle', 0.02); await delay(CFG.SPD);
    }
}
// ИСПРАВЛЕНО: Безопасный вызов логов при загрузке дисплея, вешавший консоль L.a.S ранее!
function triggerInitialSystemLoad() {
    step = 'login';
    initAudio();
    runBootLogs();
}
async function runBootLogs() {
    DOM.out.innerHTML = "";
    const p = [
        "ESTABLISHING SECURE SAT-LINK... SUCCESS", "LOADING LIQUIDATION ENGINES... LOADED", 
        "ISOLATING LOCAL ENVIRONMENTS... DONE", "PURGING UNRESOLVED TRACKERS... PURGED", 
        "CRITICAL PROTOCOL 'L.a.S' ACTIVE."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(60 + Math.random() * 60); addLine("[L.a.S-NET] | " + p[i], 'gray'); 
    }
    await delay(300); 
    await type("SYS: SECURE NETWORK DETECTED. AUTHORIZATION REQUIRED.", "gray");
    await type("SYS: MONITORING IS ENFORCED.", "error"); ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}
function ask(p, s, m) { 
    step = s; isMask = m; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); 
}
function err(m) { 
    DOM.term.classList.add('shake'); playBeep(140, 'triangle', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); 
}
async function terminalScramblerDie(m) {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true; err(m); await delay(1000);
    await type("[ВОРОН]: Код Скрамблера активирован. Спи спокойно, крыса.", "error"); await delay(1500);
    DOM.out.innerHTML = ""; DOM.singleLogo.style.display = 'block'; DOM.splitLogos.style.display = 'none';
    document.getElementById('hd').style.display = 'none'; playBeep(60, 'sawtooth', 2.0); DOM.term.classList.add('shake');
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center"; await delay(2000); location.reload();
}
async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING DATA STREAMS: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(350 + p * 1.5, 'sine', 0.02); await delay(45); 
    }
}
async function triggerAmbushDialogue() {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    playBeep(520, 'sawtooth', 0.3); playBeep(380, 'sawtooth', 0.3);
    err("⚠️ ВНИМАНИЕ: СЕТЕВОЙ ПЕРЕХВАТ! ПРИНУДИТЕЛЬНОЕ ПОДКЛЮЧЕНИЕ К УЗЛУ КОМАНДОВАНИЯ L.a.S"); await delay(1200);
    await type("[КАДРЫ]: Зафиксирована несанкционированная попытка авторизации через маркер 368.", "gray");
    await type("[КОМАНДИР]: Так, отставить панику в эфире. Я сам пообщаюсь с этим гостем. Позывной 'Ворон', на связи.", "success");
    await type("[КОМАНДИР]: Маркер 368 — это наш засадный тупик для ловли шпионов. Раз ты его ввёл, значит, перехватил каналы контрактников.", "success");
    await type("[КОМАНДИР]: Но учти сразу. Я люто презираю Сергея Долороффа — эту штабную гниду из Атлантиса. И я лично убью любого, кто хоть как-то связан с ним или его кодлой. А теперь я устрою тебе проверку.", "success");
    await delay(2000); strikes = 0; dialogueStage = 0; nextDialogueStep();
}
async function nextDialogueStep() {
    clearTimeout(wordTimer);
    if (dialogueStage === 0) {
        await type("\n[КОМАНДИР]: ВОПРОС 1. Как назывался вирус в секретном отчёте департамента, который ты читал?", "success");
        addLine("1. Вирус WE-30", "gray"); addLine("2. Протокол ATL-4091", "gray"); addLine("3. Скрипт SC-REVERSE", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 СЛИШКОМ ДОЛГОЕ МОЛЧАНИЕ."), 35000);
    } 
    else if (dialogueStage === 1) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 2. Как звали связующего по ТОС, который каждый раз запрашивал верификацию в терминале?", "success");
        addLine("1. Agent Andrey", "gray"); addLine("2. Operator Bill", "gray"); addLine("3. Commander Sin", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
    }
    else if (dialogueStage === 2) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 3. Откуда конкретно ты узнал про существование этой базы данных Атлантиса?", "success");
        addLine("1. Через досье сотрудника Атлантиса", "gray"); addLine("2. Через биографию Сергея Долороффа", "gray"); addLine("3. Перехвачено со спутникового ретранслятора", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
    }
    else if (dialogueStage === 3) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 4. Какой ID был у сотрудника из того самого досье, где ты взял информацию о базе данных?", "success");
        addLine("1. Сотрудник ID: 504", "gray"); addLine("2. Сотрудник ID: 231", "gray"); addLine("3. Сотрудник ID: 712", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
    }
    else if (dialogueStage === 4) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ВОПРОС 5. Как зовут главнокомандующего Рассонии?", "success");
        addLine("1. Командир Ворон", "gray"); addLine("2. General Седой", "gray"); addLine("3. Командир Син", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
    }
    else if (dialogueStage === 5) {
        DOM.out.innerHTML = ""; await type("[КОМАНДИР]: ФИНАЛ. Атлантис тайно ставит опыты на людях и сливает своих же бойцов. Если я открою шлюз, ты поможешь L.a.S саботировать их центральный server?", "success");
        addLine("1. Да, я сотру Атлантис в порошок.", "gray"); addLine("2. Нет, я остаюсь верен контракту штаба.", "gray"); addLine("3. Мне просто нужны файлы спецопераций.", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
    }
}
async function successAmbushDialogue() {
    clearTimeout(wordTimer); DOM.out.innerHTML = "";
    await type("[КОМАНДИР]: Разумный выбор. Ты прошёл допрос и доказал, что не связан с шавками Долороффа.", "success");
    await type("[КОМАНДИР]: Слушай и записывай. Истинный токен доступа к зашифрованной сети Ликвидаторов L.a.S — 702", "success");
    playBeep(250, 'triangle', 0.6); await delay(3500); DOM.out.innerHTML = ""; step = 'login'; ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}
async function openSecureLasMenu() {
    DOM.out.innerHTML = "";
    await type("========================================", "gray");
    await type("ACCESS GRANTED. L.a.S INTERNAL TERMINAL v1.0", "success");
    await type("СВЯЗЬ С СЕТЬЮ LIQUIDATION & SECURITY УСТАНОВЛЕНА.", "success");
    await type("1. БАЗА ТАКТИЧЕСКИХ ЦЕЛЕЙ", "success");
    await type("2. СТАТУС ЗАЧИСТКИ СЕКТОРОВ", "success");
    await type("3. АРХИВ СПЕЦОПЕРАЦИЙ L.a.S", "success");
    await type("4. ВЫЙТИ ИЗ КОНСОЛИ", "success");
    await type("========================================", "gray"); ask('ENTER COMMAND:', 'las_menu', false);
}
let sectorTimer = null;
async function startSectorMapHacking() {
    step = 'sector_h_1'; DOM.out.innerHTML = "";
    err("⚠️ КРИПТОГРАФИЧЕСКИЙ ВЗЛОМ СПУТНИКОВОЙ КАРТЫ: ФАЗА 1/3 (РАДАРНЫЙ ЗАCЛОН)");
    let n1 = Math.floor(Math.random() * 6) + 2; let n2 = Math.floor(Math.random() * 5) + 2; targetWord = (n1 * n2).toString();
    addLine(`>>> ПОГРЕШНОСТЬ ЧАСТОТЫ СЕТИ: [ ${n1} МГц ]`, "error"); addLine(`>>> СТАБИЛИЗАТОР ИМПУЛЬСА:    [ x${n2} ]`, "gray");
    ask('ВВЕДИТЕ РЕЗОНАНСНУЮ ЧАСТОТУ (УМНОЖЕНИЕ):', 'sector_h_1', false);
    clearTimeout(sectorTimer); sectorTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
}
function startSectorMapPhase2() {
    step = 'sector_h_2'; err("⚠️ КРИПТОГРАФИЧЕСКИЙ ВЗЛОМ СПУТНИКОВОЙ КАРТЫ: ФАЗА 2/3 (ТЕПЛОВАЯ СЛЕПОТА)");
    let chars = "SECTOR702"; let flash = Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    targetWord = flash; const d = addLine(`>>> МГНОВЕННЫЙ КОД ТЕПЛОВИЗОРА: [ ${flash} ]`, "error");
    setTimeout(() => { d.textContent = `>>> МГНОВЕННЫЙ КОД ТЕПЛОВИЗОРА: [ ЗАМАСКИРОВАНО ]`; ask('ВВЕДИТЕ КОД ПО ПАМЯТИ:', 'sector_h_2', false); }, 1500);
    clearTimeout(sectorTimer); sectorTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
}
function startSectorMapPhase3() {
    step = 'sector_h_3'; err("⚠️ КРИПТОГРАФИЧЕСКИЙ ВЗЛОМ СПУТНИКОВОЙ КАРТЫ: ФАЗА 3/3 (ИМПУЛЬСНЫЙ ПЕРЕХВАТ)");
    let count = Math.floor(Math.random() * 5) + 3; targetWord = count.toString(); let pulses = "■ ".repeat(count);
    addLine(`>>> ПОТОК СИГНАЛЬНЫХ МАРКЕРОВ: [ ${pulses}]`, "error"); addLine(`>>> СКОЛЬКО МАРКЕРОВ \"■\" ЗАФИКСИРОВАНО НА ЭКРАНЕ?`, "gray");
    ask('ВВЕДИТЕ ЧИСЛО ПАКЕТОВ:', 'sector_h_3', false);
    clearTimeout(sectorTimer); sectorTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ."), 35000);
}
async function displaySectorStatusMap() {
    clearTimeout(sectorTimer); DOM.out.innerHTML = ""; await bar();
    await type("===================================================", "success");
    await type("[✓] СЕКТОР 1  :: ПОЛНАЯ ЗАЧИСТКА ВЫПОЛНЕНА [100%]", "success");
    await type("[✓] СЕКТОР 2  :: ПОЛНАЯ ЗАЧИСТКА ВЫПОЛНЕНА [100%]", "success");
    await type("[✓] РЕАКТОР 4 :: РАДИАЦИОННЫЙ ПЕРИМЕТР ИЗОЛИРОВАН [100%]", "success");
    await type("[🚨] СЕКТОР 3 :: КРИТИЧЕСКИЙ СБОЙ ВЫПОЛНЕНИЯ МИССИИ!", "error");

// НОВАЯ ОПЕРАЦИЯ: Вход шпиона под ключами Церберов запускает ответный ультиматум Атлантиса!

    await type("[ДОЛОРОФФ (ATLANTIS)]: Заткнись, штабная шкура! Вы совершили фатальную ошибку. Вы нагло наложали, полезли в закрытые частоты и сломали Алтайскую глушилку нашим контрактникам из Церберов, сорвав нам зачистку Третьего сектора!", "<span style='color:#ffffff;'>"); await delay(5000);
    await type("[ДОЛОРОФФ (ATLANTIS)]: Мы не оставим это без ответа. Прямо сейчас через твой открытый терминал связи мои штурмовые отряды MGF выкрадут у L.a.S абсолютно все данные о том, как вы провернули этот взлом ленты!", "<span style='color:#ffffff;'>"); await delay(4500);

DOM.inp.oninput = () => { if(step !== 'game') DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); initAudio(); 
    const v = DOM.inp.value, cv = v.trim(); if (!v) return;
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); await delay(300);
    
    // 1. СТАРТОВЫЙ ЭКРАН ВХОДА (ИСПРАВЛЕНО: Теперь поддерживает шпионский логин Церберов!)
    if (step === 'login') {
        const inputLogin = cv.toLowerCase();
        if (inputLogin === 'las') {
            tempLogin = cv; ask('ENTER SECURITY PASSWORD:', 'login_spy_pass', true); // Запрос шпионского пароля
        } else if (cv === '368') {
            triggerAmbushDialogue(); 
        } else if (cv === CFG.REAL_TOKEN) {
            await bar(); await openSecureLasMenu(); 
        } else {
            err("CRITICAL ERROR: ACCESS DENIED. ACCOUNT SUSPENDED.");
            await delay(1500); ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    } 
    // ВАЛИДАЦИЯ ШПИОНСКОГО ПАРОЛЯ "555" ОТ БОРЗА
    else if (step === 'login_spy_pass') {
        if (cv === '555') {
            await bar(); await triggerAtlantisCounterAttackIntercept(); // Запуск сюжетной контратаки
        } else {
            err("SECURITY ALERT: INVALID PASSWORD LINK. SHUTTING DOWN PORT.");
            await delay(1500); step = 'login'; ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        }
    }
    // 2. ЭТАПЫ ДОПРОСА ВОРОНА
    else if (step === 'ambush_choice') {
        clearTimeout(wordTimer);
        if (dialogueStage === 0) {
            if (cv === '1') { dialogueStage = 1; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ОШИБКА ДАННЫХ. ЛИКВИДАЦИЯ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        } 
        else if (dialogueStage === 1) {
            if (cv === '2') { dialogueStage = 2; nextDialogueStep(); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ОШИБКА ДАННЫХ. ЛИКВИДАЦИЯ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 2) {
            if (cv === '1') { dialogueStage = 3; nextDialogueStep(); } 
            else if (cv === '2') { await terminalScramblerDie("🚨 [КОМАНДИР]: Биография Долороффа?! Так ты шпион этой штабной мрази! Активирую Скрамблер!"); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ОШИБКА ДАННЫХ. ЛИКВИДАЦИЯ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 3) {
            if (cv === '1' || cv === '3') { dialogueStage = 4; nextDialogueStep(); } 
            else if (cv === '2') { await terminalScramblerDie("🚨 [КОМАНДИР]: ID 231 — это личный шифр соглядатая Долороффа! Попался, ублюдок! Стираю систему!"); } 
            else { strikes++; if (strikes >= 2) await terminalScramblerDie("🚨 ОШИБКА ДАННЫХ. ЛИКВИДАЦИЯ."); else { err("❌ ОШИБКА."); await delay(1000); nextDialogueStep(); } }
        }
        else if (dialogueStage === 4) {
            if (cv === '3') { dialogueStage = 5; nextDialogueStep(); } 
            else { await terminalScramblerDie("🚨 [КОМАНДИР]: Не знать имя лидера Рассонии?! Ты чужак и лжец. Запуск Скрамблера."); }
        }
        else if (dialogueStage === 5) {
            if (cv === '1' || cv === '3') { successAmbushDialogue(); } 
            else { await terminalScramblerDie("🚨 [КОМАНДИР]: Защищаешь Атлантис? Умри вместе с ними."); }
        }
    }
    // 3. НАВИГАЦИЯ ПО ГЛАВНОМУ МЕНЮ L.A.S
    else if (step === 'las_menu') {
        if (cv === '4') {
            await type(">>> РАЗРЫВ СОЕДИНЕНИЯ С СЕТЬЮ L.a.S...", "gray");
            await delay(1000); DOM.out.innerHTML = ""; step = 'login';
            ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
        } else if (cv === '3') {
            showCassetteArchive(); 
        } else if (cv === '2') {
            startSectorMapHacking(); // Открываем новый квест взлома секторов про побег Долороффа!
        } else if (cv === '1') {
            await type(">>> ОШИБКА: РАЗДЕЛ ЗАШИФРОВАН. ОЖИДАНИЕ ТАКТИЧЕСКИХ ФАЗ С СЕРВЕРА...", "error");
            await delay(1500); ask('ENTER COMMAND:', 'las_menu', false);
        } else {
            err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); ask('ENTER COMMAND:', 'las_menu', false);
        }
    }
    // 4. ВЫБОР КАССЕТ В СЕКРЕТНОМ АРХИВЕ
    else if (step === 'select_cassette') {
        if (cv === '1') { startReUnionHacking(); } 
        else if (cv === '2') { startWe30Hacking(); }   
        else if (cv === '4') { startCassetteHackingPhase1(); } 
        else if (cv === '5') { openSecureLasMenu(); } 
        else { err("НЕВЕРНЫЙ ВЫБОР."); await delay(1000); showCassetteArchive(); }
    }
    // 5. ВАЛИДАЦИЯ ИМПУЛЬСОВ ВЗЛОМА КАРТЫ СЕКТОРОВ
    else if (step === 'sector_h_1') {
        if (cv === targetWord) startSectorMapPhase2(); else await terminalScramblerDie("🚨 ПРОВАЛ ЧАСТОТЫ КАРТЫ.");
    }
    else if (step === 'sector_h_2') {
        if (cv.toUpperCase() === targetWord) startSectorMapPhase3(); else await terminalScramblerDie("🚨 ПРОВАЛ МАТРИЦЫ КАРТЫ.");
    }
    else if (step === 'sector_h_3') {
        if (cv === targetWord) displaySectorStatusMap(); else await terminalScramblerDie("🚨 КРАШ СВЯЗИ.");
    }
    // 6. ВАЛИДАЦИЯ ОТВЕТОВ В ФАЗАХ ДЕШИФРАЦИИ КАССЕТ
    else if (step === 'reunion_h_1') {
        if (cv === targetWord) { await successReUnionHacking(); } 
        else { await terminalScramblerDie("🚨 КРИТИЧЕСКАЯ ОШИБКА СИНХРОНИЗАЦИИ НИИ. КРАШ."); }
    }
    else if (step === 'we30_h_1') {
        if (cv === targetWord) { await triggerReUnionDialogueIntercept(); } 
        else { await terminalScramblerDie("🚨 ПАКЕТ ДАННЫХ ПОВРЕЖДЕН. СНОС СИСТЕМЫ."); }
    }
    else if (step === 'cassette_h_1') {
        if (cv === targetWord) { await triggerDialogueInterlude1(); } 
        else { await terminalScramblerDie("🚨 ОШИБКА ДЕШИФРАЦИИ ЛЕНТЫ. СКРАМБЛЕР."); }
    }
    else if (step === 'cassette_h_2') {
        if (cv.toUpperCase() === targetWord) { await triggerDialogueInterlude2(); } 
        else { await terminalScramblerDie("🚨 ИМПУЛЬС МАТРИЦЫ НЕ СОВПАЛ. КРАШ."); }
    }
    else if (step === 'cassette_h_3') {
        if (cv === targetWord) { await successCassetteHacking(); } 
        else { await terminalScramblerDie("🚨 СИНХРОНИЗАЦИЯ ПРОВАЛЕНА. КРАШ."); }
    }
};

    initAudio();
    if (DOM.inp.disabled === false) DOM.inp.focus();
};
